<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>solderscope</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header>
  <h1>solderscope</h1>
  <div class="status">
    <span id="dot" class="dot"></span>
    <span id="statusText">connecting…</span>
    <span id="disk" class="disk"></span>
  </div>
</header>

<main>
  <section class="live">
    <div class="frame">
      <iframe id="player" src="" allow="autoplay; fullscreen"></iframe>
      <button id="fullscreen" title="Fullscreen">⛶</button>
      <div id="busy" class="busy hidden">
        <div class="spinner"></div>
        <p id="busyText">Taking photo…</p>
        <small>The stream comes back on its own.</small>
      </div>
    </div>

    <div class="controls">
      <input id="job" type="text" placeholder="Job / customer (optional)" autocomplete="off">
      <button id="photo" class="primary">📷 Photo (12 MP)</button>
      <button id="record">⏺ Start recording</button>
    </div>

    <div class="controls sessionControls" id="sessionIdle">
      <input id="sessionName" type="text" placeholder="Session name (optional)" autocomplete="off">
      <label class="intervalWrap">
        <input id="sessionInterval" type="number" min="5" max="3600" value="30" inputmode="numeric">
        <span>s</span>
      </label>
      <button id="sessionStart">▶ Start session</button>
    </div>

    <!-- Shown while a session runs; the stream is stopped, so the last frame
         stands in for the live view. -->
    <div class="sessionPanel hidden" id="sessionPanel">
      <img id="sessionShot" alt="Last captured frame">
      <div class="sessionInfo">
        <b id="sessionTitle">Session</b>
        <span id="sessionStats">0 photos · 0:00</span>
        <span id="sessionError" class="err"></span>
      </div>
      <button id="sessionStop" class="recording">⏹ Stop session</button>
    </div>

    <p id="hint" class="hint"></p>
  </section>

  <section class="gallery">
    <div class="tabs">
      <button class="tab active" data-tab="photos">Photos</button>
      <button class="tab" data-tab="videos">Videos</button>
      <button class="tab" data-tab="sessions">Sessions</button>
    </div>
    <div id="photos" class="grid"></div>
    <div id="videos" class="grid hidden"></div>
    <div id="sessions" class="sessionList hidden"></div>
  </section>
</main>

<!-- Annotation editor, Flameshot-style toolbar -->
<div id="editor" class="overlay hidden">
  <div class="editorBar">
    <div class="group tools">
      <button class="tool active" data-tool="arrow" title="Arrow (A)">↗</button>
      <button class="tool" data-tool="line" title="Line (L)">╱</button>
      <button class="tool" data-tool="rect" title="Rectangle (R)">▭</button>
      <button class="tool" data-tool="ellipse" title="Ellipse (E)">◯</button>
      <button class="tool" data-tool="free" title="Freehand (F)">✎</button>
      <button class="tool" data-tool="marker" title="Marker (M)">▬</button>
      <button class="tool" data-tool="text" title="Text (T)">T</button>
      <button class="tool" data-tool="counter" title="Numbered callout (C)">①</button>
      <button class="tool" data-tool="pixelate" title="Pixelate (P)">▒</button>
      <button class="tool" data-tool="crop" title="Crop (K)">⛶</button>
    </div>

    <div class="group cropActions hidden" id="cropActions">
      <button id="cropApply" class="primary">Crop</button>
      <button id="cropCancel">Cancel</button>
    </div>

    <span class="sep"></span>

    <div class="group colors">
      <label class="swatch"><input type="radio" name="col" value="#ff2d2d" checked><i style="background:#ff2d2d"></i></label>
      <label class="swatch"><input type="radio" name="col" value="#ffd400"><i style="background:#ffd400"></i></label>
      <label class="swatch"><input type="radio" name="col" value="#00e05a"><i style="background:#00e05a"></i></label>
      <label class="swatch"><input type="radio" name="col" value="#2d9bff"><i style="background:#2d9bff"></i></label>
      <label class="swatch"><input type="radio" name="col" value="#ffffff"><i style="background:#fff"></i></label>
      <label class="swatch"><input type="radio" name="col" value="#000000"><i style="background:#000"></i></label>
    </div>

    <span class="sep"></span>

    <div class="group">
      <label class="rangeWrap" title="Stroke width">
        <span class="rangeIcon">●</span>
        <input id="width" type="range" min="1" max="8" value="3">
      </label>
      <!-- Shown only while a shape tool is active, so it cannot be mistaken
           for a global setting. -->
      <button id="fill" class="hidden" title="Shade the inside of the shape">◐ Shade</button>
    </div>

    <span class="sep"></span>

    <div class="group">
      <button id="undo" title="Undo (Ctrl+Z)">↶</button>
      <button id="redo" title="Redo (Ctrl+Y)">↷</button>
      <button id="clear" title="Remove all annotations">Clear</button>
    </div>

    <span class="grow"></span>

    <div class="group">
      <button id="download" title="Download to this device">⤓ Download</button>
      <button id="save" class="primary">Save</button>
      <button id="close" title="Close (Esc)">✕</button>
    </div>
  </div>

  <div class="canvasWrap">
    <div class="canvasStage">
      <canvas id="canvas"></canvas>
      <!-- In-place text entry: no browser prompt() dialog -->
      <textarea id="textInput" class="hidden" spellcheck="false" rows="1"></textarea>
    </div>
  </div>
  <p class="editorHint" id="editorHint"></p>
</div>

<script src="/app.js"></script>
</body>
</html>
